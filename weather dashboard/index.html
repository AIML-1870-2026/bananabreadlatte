<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a0812;
      --card: #240d1a;
      --border: rgba(244, 114, 182, 0.18);
      --accent: #f472b6;
      --accent-dim: rgba(244, 114, 182, 0.25);
      --text: #fce7f3;
      --muted: #b06090;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
    }

    /* Radial glows */
    body::before, body::after {
      content: '';
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
    }
    body::before {
      top: -20%; left: -10%;
      width: 70%; height: 70%;
      background: radial-gradient(ellipse, rgba(244,114,182,0.07) 0%, transparent 65%);
    }
    body::after {
      bottom: -20%; right: -10%;
      width: 60%; height: 60%;
      background: radial-gradient(ellipse, rgba(190,24,93,0.07) 0%, transparent 65%);
    }

    #stars {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── App shell ─────────────────────────────── */
    .app {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ───────────────────────────────── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      animation: fadeIn .4s ease;
    }

    .logo {
      font-size: 1.05rem;
      font-weight: 800;
      white-space: nowrap;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .logo .accent { color: var(--accent); }
    .logo sub {
      font-family: 'DM Mono', monospace;
      font-size: .6rem;
      color: var(--muted);
      font-weight: 400;
      vertical-align: baseline;
      margin-left: 4px;
    }

    .field {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: .82rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      min-width: 0;
    }
    .field::placeholder { color: var(--muted); }
    .field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    #apiKey    { width: 190px; flex-shrink: 0; }
    #cityInput { flex: 1; min-width: 140px; }

    .unit-toggle {
      display: flex;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .unit-btn {
      padding: 8px 13px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: .82rem;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .unit-btn.active {
      background: var(--accent);
      color: #1a0812;
      font-weight: 500;
    }

    .search-btn {
      padding: 8px 18px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #1a0812;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: .88rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: opacity .2s, transform .1s;
    }
    .search-btn:hover  { opacity: .85; }
    .search-btn:active { transform: scale(.97); }
    .search-btn:disabled { opacity: .5; cursor: not-allowed; }

    .loader {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(26,8,18,.3);
      border-top-color: #1a0812;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
    }

    /* ── Error banner ────────────────────────── */
    .error-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(239,68,68,.08);
      border-bottom: 1px solid rgba(239,68,68,.2);
      padding: 8px 18px;
      color: #fca5a5;
      font-family: 'DM Mono', monospace;
      font-size: .8rem;
      flex-shrink: 0;
      animation: fadeIn .3s ease;
    }
    .error-banner.show { display: flex; }
    .error-close {
      margin-left: auto;
      background: none; border: none;
      color: #fca5a5; cursor: pointer;
      font-size: 1rem; line-height: 1;
    }

    /* ── Content grid ────────────────────────── */
    .content {
      flex: 1;
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 14px;
      padding: 14px 18px;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Left col: current weather ───────────── */
    .weather-card {
      display: none;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      overflow-y: auto;
      min-height: 0;
      animation: slideUp .4s ease;
    }
    .weather-card.show { display: flex; }

    /* Empty left-col placeholder */
    .empty-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: .8rem;
      text-align: center;
    }
    .empty-left.hidden { display: none; }
    .empty-left .big { font-size: 2.5rem; opacity: .4; }

    .wc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2px;
    }
    .city-name {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.1;
    }
    .country-badge {
      font-family: 'DM Mono', monospace;
      font-size: .68rem;
      color: var(--accent);
      background: rgba(244,114,182,.1);
      border: 1px solid var(--accent-dim);
      border-radius: 5px;
      padding: 2px 7px;
      margin-left: 7px;
      vertical-align: middle;
    }
    .wx-icon { font-size: 2.2rem; line-height: 1; }

    .wc-temp-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 4px 0 1px;
    }
    .temp-main {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .feels-like {
      font-family: 'DM Mono', monospace;
      font-size: .78rem;
      color: var(--muted);
    }
    .wx-desc {
      font-family: 'DM Mono', monospace;
      font-size: .82rem;
      color: var(--muted);
      text-transform: capitalize;
      margin-bottom: 12px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .stat-card {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 10px;
      padding: 9px 12px;
    }
    .stat-label {
      font-family: 'DM Mono', monospace;
      font-size: .63rem;
      color: var(--muted);
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .stat-value {
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      font-weight: 500;
    }

    .sun-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-top: 1px solid rgba(255,255,255,.05);
      border-bottom: 1px solid rgba(255,255,255,.05);
      margin-bottom: 10px;
      font-family: 'DM Mono', monospace;
      font-size: .78rem;
      color: var(--muted);
    }
    .sun-row span { color: var(--text); }

    .range-labels {
      display: flex;
      justify-content: space-between;
      font-family: 'DM Mono', monospace;
      font-size: .68rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .range-track {
      height: 5px;
      background: rgba(255,255,255,.08);
      border-radius: 3px;
      position: relative;
    }
    .range-fill {
      position: absolute;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #f472b6, #e879f9);
    }
    .range-dot {
      position: absolute;
      width: 11px; height: 11px;
      background: var(--accent);
      border: 2px solid var(--card);
      border-radius: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 7px var(--accent);
    }

    /* ── Right column ────────────────────────── */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Forecast ────────────────────────────── */
    #forecastSection { flex-shrink: 0; }
    .forecast-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .forecast-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
      flex: 1;
      min-width: 90px;
      text-align: center;
      flex-shrink: 0;
      transition: border-color .2s;
    }
    .forecast-card:hover { border-color: var(--accent); }
    .fc-day {
      font-family: 'DM Mono', monospace;
      font-size: .63rem;
      color: var(--muted);
      letter-spacing: .07em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .fc-icon { font-size: 1.5rem; margin-bottom: 5px; }
    .fc-high {
      font-family: 'DM Mono', monospace;
      font-size: .85rem;
      color: var(--accent);
    }
    .fc-low {
      font-family: 'DM Mono', monospace;
      font-size: .78rem;
      color: var(--muted);
      margin-top: 1px;
    }
    .fc-desc {
      font-family: 'DM Mono', monospace;
      font-size: .63rem;
      color: var(--muted);
      margin-top: 4px;
      text-transform: capitalize;
    }

    /* ── AQI + UV side by side ───────────────── */
    .aqi-uv-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ── City time card ──────────────────────── */
    .city-time-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .ct-label {
      font-family: 'DM Mono', monospace;
      font-size: .63rem;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .8;
      margin-bottom: 5px;
    }
    .ct-time {
      font-family: 'DM Mono', monospace;
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--text);
      letter-spacing: .04em;
      line-height: 1;
      margin-bottom: 3px;
    }
    .ct-date {
      font-family: 'DM Mono', monospace;
      font-size: .72rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .ct-sep {
      height: 1px;
      background: rgba(255,255,255,.05);
      margin-bottom: 10px;
    }
    .ct-vibe-label {
      font-family: 'DM Mono', monospace;
      font-size: .63rem;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .8;
      margin-bottom: 5px;
    }
    .ct-vibe {
      font-family: 'DM Mono', monospace;
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
    }
    .uv-in-card {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.05);
      align-items: center;
      gap: 12px;
    }
    .uv-in-card.show { display: flex; }

    .aqi-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      height: 100%;
    }
    .aqi-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .aqi-badge {
      font-family: 'DM Mono', monospace;
      font-size: .73rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid;
      letter-spacing: .04em;
      flex-shrink: 0;
    }
    .aqi-label {
      font-family: 'DM Mono', monospace;
      font-size: .9rem;
      font-weight: 500;
    }
    .aqi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .aqi-item {
      background: rgba(255,255,255,.03);
      border-radius: 8px;
      padding: 7px 10px;
    }
    .aqi-item-label {
      font-family: 'DM Mono', monospace;
      font-size: .62rem;
      color: var(--muted);
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .aqi-item-val {
      font-family: 'DM Mono', monospace;
      font-size: .85rem;
      margin-top: 1px;
    }

    .uv-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 100%;
    }
    .uv-gauge {
      width: 54px; height: 54px;
      border-radius: 50%;
      border: 3px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 1.35rem;
      font-weight: 500;
      flex-shrink: 0;
    }
    .uv-level {
      font-size: .9rem;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .uv-tip {
      font-family: 'DM Mono', monospace;
      font-size: .72rem;
      color: var(--muted);
    }

    /* ── Map ─────────────────────────────────── */
    #mapSection {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .map-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      min-height: 0;
    }
    .map-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 10px 12px;
      flex-shrink: 0;
    }
    .layer-btn {
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
    }
    .layer-btn:hover { border-color: var(--accent); color: var(--text); }
    .layer-btn.active { background: var(--accent); border-color: var(--accent); color: #1a0812; }
    #map { flex: 1; min-height: 0; }

    /* ── City fact ───────────────────────────── */
    .city-fact {
      display: none;
      flex-direction: column;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.05);
      flex: 1;
      min-height: 0;
    }
    .city-fact.show { display: flex; }
    .city-fact-label {
      font-family: 'DM Mono', monospace;
      font-size: .63rem;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 7px;
      opacity: .8;
    }
    .city-fact-text {
      font-family: 'DM Mono', monospace;
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.6;
      overflow-y: auto;
    }

    /* ── Right empty state ───────────────────── */
    .right-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
      animation: fadeIn .5s ease;
    }
    .right-empty.hidden { display: none; }
    .right-empty p {
      font-family: 'DM Mono', monospace;
      font-size: .78rem;
      line-height: 1.7;
    }
    .orbs {
      display: flex;
      gap: 18px;
    }
    .orb {
      font-size: 1.9rem;
      display: inline-block;
      animation: floatOrb 3s ease-in-out infinite;
      filter: saturate(.6);
    }
    .orb:nth-child(1) { animation-delay: 0s; }
    .orb:nth-child(2) { animation-delay: .55s; }
    .orb:nth-child(3) { animation-delay: 1.1s; }
    .orb:nth-child(4) { animation-delay: 1.65s; }
    .orb:nth-child(5) { animation-delay: 2.2s; }

    /* ── Hidden ──────────────────────────────── */
    .hidden { display: none !important; }

    /* ── Animations ──────────────────────────── */
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-10px) rotate(4deg); }
    }

    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="app">

    <!-- Top bar -->
    <div class="topbar">
      <div class="logo">🌸 <span class="accent">Weather</span><sub>dashboard</sub></div>
      <input type="password" id="apiKey" class="field"
             placeholder="API key" autocomplete="off">
      <div class="unit-toggle">
        <button class="unit-btn active" id="btnF" onclick="setUnit('imperial')">°F</button>
        <button class="unit-btn"        id="btnC" onclick="setUnit('metric')">°C</button>
      </div>
      <input type="text" id="cityInput" class="field"
             placeholder="City name (e.g. Tokyo, JP)"
             onkeydown="if(event.key==='Enter') doSearch()">
      <button class="search-btn" id="searchBtn" onclick="doSearch()">Search</button>
    </div>

    <!-- Error banner -->
    <div class="error-banner" id="errorBanner">
      <span>⚠️</span>
      <span id="errorText"></span>
      <button class="error-close" onclick="hideError()">×</button>
    </div>

    <!-- Main content -->
    <div class="content">

      <!-- Left: current weather / empty state -->
      <div class="empty-left" id="emptyLeft">
        <div class="big">🌸</div>
        <span>enter a city to<br>see the weather</span>
      </div>

      <div class="weather-card" id="weatherCard">
        <div class="wc-header">
          <div>
            <div class="city-name" id="cityName"></div>
            <div class="wx-desc" id="wxDesc"></div>
          </div>
          <div class="wx-icon" id="wxIcon"></div>
        </div>

        <div class="wc-temp-row">
          <div class="temp-main" id="tempMain"></div>
          <div class="feels-like" id="feelsLike"></div>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Humidity</div>
            <div class="stat-value" id="sHumidity">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Wind</div>
            <div class="stat-value" id="sWind">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pressure</div>
            <div class="stat-value" id="sPressure">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Visibility</div>
            <div class="stat-value" id="sVisibility">—</div>
          </div>
        </div>

        <div class="sun-row">
          <div>🌅 Sunrise <span id="sunriseTime">—</span></div>
          <div>🌇 Sunset <span id="sunsetTime">—</span></div>
        </div>

        <div class="range-labels">
          <span id="rangeLow">—</span>
          <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:.65rem">today's range</span>
          <span id="rangeHigh">—</span>
        </div>
        <div class="range-track">
          <div class="range-fill" id="rangeFill"></div>
          <div class="range-dot"  id="rangeDot"></div>
        </div>

        <div class="city-fact" id="cityFact">
          <div class="city-fact-label">📍 city snapshot</div>
          <div class="city-fact-text" id="cityFactText"></div>
        </div>
      </div>

      <!-- Right column -->
      <div class="right-col">

        <!-- Empty state -->
        <div class="right-empty" id="rightEmpty">
          <div class="orbs">
            <span class="orb">☀️</span>
            <span class="orb">🌧️</span>
            <span class="orb">❄️</span>
            <span class="orb">⛅</span>
            <span class="orb">🌈</span>
          </div>
          <p>search for a city to explore<br>forecast · air quality · map</p>
        </div>

        <!-- 5-Day Forecast -->
        <div id="forecastSection" class="hidden">
          <div class="forecast-row" id="forecastRow"></div>
        </div>

        <!-- AQI + UV -->
        <div class="aqi-uv-row">
          <div id="aqiSection" class="hidden">
            <div class="aqi-card">
              <div class="aqi-header">
                <div class="aqi-badge" id="aqiBadge"></div>
                <div class="aqi-label" id="aqiLabel"></div>
              </div>
              <div class="aqi-grid">
                <div class="aqi-item">
                  <div class="aqi-item-label">PM2.5</div>
                  <div class="aqi-item-val" id="aqiPm25">—</div>
                </div>
                <div class="aqi-item">
                  <div class="aqi-item-label">PM10</div>
                  <div class="aqi-item-val" id="aqiPm10">—</div>
                </div>
                <div class="aqi-item">
                  <div class="aqi-item-label">NO₂</div>
                  <div class="aqi-item-val" id="aqiNo2">—</div>
                </div>
                <div class="aqi-item">
                  <div class="aqi-item-label">O₃ Ozone</div>
                  <div class="aqi-item-val" id="aqiO3">—</div>
                </div>
              </div>
            </div>
          </div>

          <div id="cityTimeSection" class="hidden">
            <div class="city-time-card">
              <div class="ct-label">🕐 local time</div>
              <div class="ct-time" id="ctTime">—</div>
              <div class="ct-date" id="ctDate">—</div>
              <div class="ct-sep"></div>
              <div class="ct-vibe-label">today's vibe</div>
              <div class="ct-vibe" id="ctVibe">—</div>
              <!-- UV index slotted in here if API supports it -->
              <div class="uv-in-card" id="uvInCard">
                <div class="uv-gauge" id="uvGauge"></div>
                <div>
                  <div class="uv-level" id="uvLevel"></div>
                  <div class="uv-tip"   id="uvTip"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Map -->
        <div id="mapSection" class="hidden">
          <div class="map-card">
            <div class="map-controls">
              <button class="layer-btn active" onclick="setMapLayer('precipitation_new',this)">🌧 Rain</button>
              <button class="layer-btn"        onclick="setMapLayer('temp_new',this)">🌡 Temp</button>
              <button class="layer-btn"        onclick="setMapLayer('wind_new',this)">💨 Wind</button>
              <button class="layer-btn"        onclick="setMapLayer('clouds_new',this)">☁️ Clouds</button>
            </div>
            <div id="map"></div>
          </div>
        </div>

      </div><!-- .right-col -->
    </div><!-- .content -->
  </div><!-- .app -->

  <script>
  // ── Star field ────────────────────────────────────────────
  (function () {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = [];
      const n = Math.floor((canvas.width * canvas.height) / 7500);
      for (let i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.1 + 0.3,
          phase: Math.random() * Math.PI * 2,
          speed: 0.003 + Math.random() * 0.007
        });
      }
    }

    function draw(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        const alpha = 0.15 + 0.85 * (0.5 + 0.5 * Math.sin(t * s.speed * 0.001 + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,220,240,${alpha})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    resize(); initStars(); requestAnimationFrame(draw);
    window.addEventListener('resize', () => { resize(); initStars(); });
  })();

  // ── State ─────────────────────────────────────────────────
  let currentUnit = 'imperial';
  let currentCity = '';
  let currentCoords = null;
  let leafletMap = null;
  let weatherTileLayer = null;
  let activeMapLayer = 'precipitation_new';

  // Persist API key in sessionStorage
  const apiKeyEl = document.getElementById('apiKey');
  const saved = sessionStorage.getItem('owm_key');
  if (saved) apiKeyEl.value = saved;
  apiKeyEl.addEventListener('input', () =>
    sessionStorage.setItem('owm_key', apiKeyEl.value.trim()));

  // ── Unit toggle ───────────────────────────────────────────
  function setUnit(unit) {
    currentUnit = unit;
    document.getElementById('btnF').classList.toggle('active', unit === 'imperial');
    document.getElementById('btnC').classList.toggle('active', unit === 'metric');
    if (currentCity) doSearch(true);
  }

  // ── Weather emoji ─────────────────────────────────────────
  function wxEmoji(id, dt, rise, set) {
    const day = dt >= rise && dt < set;
    if (id >= 200 && id < 300) return '⛈️';
    if (id >= 300 && id < 400) return '🌦️';
    if (id >= 500 && id < 511) return id === 500 ? '🌦️' : '🌧️';
    if (id >= 511 && id < 600) return '🌨️';
    if (id >= 600 && id < 700) return '❄️';
    if (id >= 700 && id < 800) return '🌫️';
    if (id === 800) return day ? '☀️' : '🌙';
    if (id === 801) return '🌤️';
    if (id === 802) return '⛅';
    return '☁️';
  }

  // ── Format UTC+offset time ────────────────────────────────
  function fmtTime(ts, tz) {
    const d = new Date((ts + tz) * 1000);
    let h = d.getUTCHours(), m = d.getUTCMinutes();
    const ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2,'0')} ${ap}`;
  }

  // ── Errors ────────────────────────────────────────────────
  function showError(msg) {
    document.getElementById('errorText').textContent = msg;
    document.getElementById('errorBanner').classList.add('show');
  }
  function hideError() {
    document.getElementById('errorBanner').classList.remove('show');
  }

  // ── Main search ───────────────────────────────────────────
  async function doSearch(silent = false) {
    const key  = apiKeyEl.value.trim();
    const city = document.getElementById('cityInput').value.trim();

    if (!key)  { showError('Please enter your OpenWeatherMap API key.'); return; }
    if (!city && !silent)  { showError('Please enter a city name.'); return; }
    if (!city && silent && !currentCity) return;

    hideError();
    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loader"></span>';

    try {
      await fetchCurrent(key, city || currentCity);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Search';
    }
  }

  async function fetchCurrent(key, city) {
    let res, data;
    try {
      res  = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=${currentUnit}&appid=${key}`);
      data = await res.json();
    } catch {
      showError('Could not reach the weather service. Check your connection.');
      return;
    }

    if (res.status === 401) { showError('Invalid API key. Check your OpenWeatherMap account.');                              return; }
    if (res.status === 404) { showError('City not found. Try a different spelling or add a country code (e.g. Paris, FR).'); return; }
    if (!res.ok)            { showError('An unexpected error occurred. Please try again.');                                  return; }

    renderCurrent(data);
    currentCity   = city;
    currentCoords = { lat: data.coord.lat, lon: data.coord.lon };

    const k = key;
    fetchForecast(k, city);
    fetchAQI(k, currentCoords.lat, currentCoords.lon);
    fetchUV(k, currentCoords.lat, currentCoords.lon);
    initMap(currentCoords.lat, currentCoords.lon, k);
    fetchCityFact(city, data.name);
  }

  function renderCurrent(d) {
    const u  = currentUnit === 'imperial' ? '°F' : '°C';
    const su = currentUnit === 'imperial' ? 'mph' : 'm/s';

    document.getElementById('emptyLeft').classList.add('hidden');
    document.getElementById('rightEmpty').classList.add('hidden');

    document.getElementById('cityName').innerHTML =
      `${d.name} <span class="country-badge">${d.sys.country}</span>`;
    document.getElementById('wxIcon').textContent =
      wxEmoji(d.weather[0].id, d.dt, d.sys.sunrise, d.sys.sunset);
    document.getElementById('wxDesc').textContent   = d.weather[0].description;
    document.getElementById('tempMain').textContent = `${Math.round(d.main.temp)}${u}`;
    document.getElementById('feelsLike').textContent = `feels like ${Math.round(d.main.feels_like)}${u}`;

    document.getElementById('sHumidity').textContent  = `${d.main.humidity}%`;
    document.getElementById('sWind').textContent      = `${Math.round(d.wind.speed)} ${su}`;
    document.getElementById('sPressure').textContent  = `${d.main.pressure} hPa`;
    const vis = d.visibility != null
      ? (d.visibility >= 1000 ? `${(d.visibility/1000).toFixed(1)} km` : `${d.visibility} m`)
      : '—';
    document.getElementById('sVisibility').textContent = vis;

    document.getElementById('sunriseTime').textContent = fmtTime(d.sys.sunrise, d.timezone);
    document.getElementById('sunsetTime').textContent  = fmtTime(d.sys.sunset,  d.timezone);

    const lo  = Math.round(d.main.temp_min);
    const hi  = Math.round(d.main.temp_max);
    const cur = Math.round(d.main.temp);
    document.getElementById('rangeLow').textContent  = `Low ${lo}${u}`;
    document.getElementById('rangeHigh').textContent = `High ${hi}${u}`;
    const span = (hi - lo) || 1;
    const pct  = Math.min(100, Math.max(0, ((cur - lo) / span) * 100));
    document.getElementById('rangeFill').style.width = `${pct}%`;
    document.getElementById('rangeDot').style.left   = `${pct}%`;

    document.getElementById('weatherCard').classList.add('show');
    renderCityTime(d);
  }

  // ── 5-Day Forecast ────────────────────────────────────────
  async function fetchForecast(key, city) {
    try {
      const res  = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&units=${currentUnit}&cnt=40&appid=${key}`);
      if (!res.ok) return;
      renderForecast(await res.json());
    } catch { /* silent */ }
  }

  function renderForecast(data) {
    const u = currentUnit === 'imperial' ? '°F' : '°C';
    const today = new Date().toDateString();
    const DAYS  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const byDay = {};
    for (const item of data.list) {
      const key = new Date(item.dt * 1000).toDateString();
      if (key === today) continue;
      if (!byDay[key]) byDay[key] = { highs:[], lows:[], ids:[], descs:[], dt: item.dt };
      byDay[key].highs.push(item.main.temp_max);
      byDay[key].lows.push(item.main.temp_min);
      byDay[key].ids.push(item.weather[0].id);
      byDay[key].descs.push(item.weather[0].description);
    }

    const row = document.getElementById('forecastRow');
    row.innerHTML = '';
    let n = 0;

    for (const [dateStr, info] of Object.entries(byDay)) {
      if (n++ >= 5) break;
      const d    = new Date(dateStr);
      const hi   = Math.round(Math.max(...info.highs));
      const lo   = Math.round(Math.min(...info.lows));
      const desc = info.descs[Math.floor(info.descs.length / 2)];

      const freq = {};
      for (const id of info.ids) freq[id] = (freq[id]||0) + 1;
      const domId = +Object.entries(freq).sort((a,b) => b[1]-a[1])[0][0];
      const emoji = wxEmoji(domId, info.dt, info.dt - 21600, info.dt + 21600);

      const card = document.createElement('div');
      card.className = 'forecast-card';
      card.innerHTML = `
        <div class="fc-day">${DAYS[d.getDay()]}</div>
        <div class="fc-icon">${emoji}</div>
        <div class="fc-high">${hi}${u}</div>
        <div class="fc-low">${lo}${u}</div>
        <div class="fc-desc">${desc}</div>`;
      row.appendChild(card);
    }

    document.getElementById('forecastSection').classList.remove('hidden');
    setTimeout(() => leafletMap && leafletMap.invalidateSize(), 50);
  }

  // ── Air Quality ───────────────────────────────────────────
  async function fetchAQI(key, lat, lon) {
    try {
      const res = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${key}`);
      if (!res.ok) return;
      renderAQI(await res.json());
    } catch { /* silent */ }
  }

  const AQI_INFO = {
    1: { label:'Good',      color:'#4ade80', bg:'rgba(74,222,128,.15)'  },
    2: { label:'Fair',      color:'#facc15', bg:'rgba(250,204,21,.15)'  },
    3: { label:'Moderate',  color:'#fb923c', bg:'rgba(251,146,60,.15)'  },
    4: { label:'Poor',      color:'#f87171', bg:'rgba(248,113,113,.15)' },
    5: { label:'Very Poor', color:'#c084fc', bg:'rgba(192,132,252,.15)' },
  };

  function renderAQI(data) {
    const aqi  = data.list[0].main.aqi;
    const comp = data.list[0].components;
    const info = AQI_INFO[aqi] || AQI_INFO[3];

    const badge = document.getElementById('aqiBadge');
    badge.textContent       = `AQI ${aqi}`;
    badge.style.color       = info.color;
    badge.style.background  = info.bg;
    badge.style.borderColor = info.color;

    const label = document.getElementById('aqiLabel');
    label.textContent = info.label;
    label.style.color = info.color;

    document.getElementById('aqiPm25').textContent = `${comp.pm2_5.toFixed(1)} µg/m³`;
    document.getElementById('aqiPm10').textContent = `${comp.pm10.toFixed(1)} µg/m³`;
    document.getElementById('aqiNo2').textContent  = `${comp.no2.toFixed(1)} µg/m³`;
    document.getElementById('aqiO3').textContent   = `${comp.o3.toFixed(1)} µg/m³`;

    document.getElementById('aqiSection').classList.remove('hidden');
    setTimeout(() => leafletMap && leafletMap.invalidateSize(), 50);
  }

  // ── UV Index ──────────────────────────────────────────────
  async function fetchUV(key, lat, lon) {
    try {
      const res = await fetch(`https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&exclude=minutely,hourly,daily,alerts&appid=${key}`);
      if (!res.ok) return;
      const data = await res.json();
      if (data.current?.uvi != null) renderUV(data.current.uvi);
    } catch { /* silent */ }
  }

  function uvMeta(uvi) {
    if (uvi <= 2)  return { level:'Low',       tip:'No protection needed.',           color:'#4ade80' };
    if (uvi <= 5)  return { level:'Moderate',  tip:'Sunscreen recommended.',          color:'#facc15' };
    if (uvi <= 7)  return { level:'High',      tip:'Sunscreen required. Wear a hat.', color:'#fb923c' };
    if (uvi <= 10) return { level:'Very High', tip:'Extra protection needed.',        color:'#f87171' };
    return             { level:'Extreme',   tip:'Avoid outdoors at midday.',       color:'#c084fc' };
  }

  function renderUV(uvi) {
    const m = uvMeta(uvi);
    const g = document.getElementById('uvGauge');
    g.textContent       = Math.round(uvi);
    g.style.color       = m.color;
    g.style.borderColor = m.color;
    g.style.boxShadow   = `0 0 16px ${m.color}50`;

    const lv = document.getElementById('uvLevel');
    lv.textContent = `UV — ${m.level}`;
    lv.style.color = m.color;
    document.getElementById('uvTip').textContent = m.tip;
    document.getElementById('uvInCard').classList.add('show');
    setTimeout(() => leafletMap && leafletMap.invalidateSize(), 50);
  }

  // ── City time + vibe ──────────────────────────────────────
  let _clockInterval = null;

  function renderCityTime(d) {
    const tz = d.timezone; // seconds offset from UTC
    const id = d.weather[0].id;
    const temp = d.main.temp;

    // Weather advisory
    let vibe;
    if      (id >= 200 && id < 300) vibe = 'Thunderstorms nearby — stay indoors if you can.';
    else if (id >= 300 && id < 500) vibe = 'Drizzly out — grab an umbrella before heading out.';
    else if (id >= 500 && id < 600) vibe = 'Rainy conditions — an umbrella is a must today.';
    else if (id >= 600 && id < 700) vibe = 'Snow on the ground — bundle up and drive carefully.';
    else if (id >= 700 && id < 800) vibe = 'Low visibility out there — take it slow.';
    else if (id === 800) {
      const hot  = currentUnit === 'imperial' ? temp > 85  : temp > 29;
      const warm = currentUnit === 'imperial' ? temp > 65  : temp > 18;
      const cold = currentUnit === 'imperial' ? temp < 45  : temp < 7;
      if (hot)       vibe = 'Sunny and hot — stay hydrated and wear sunscreen.';
      else if (warm) vibe = 'Clear and lovely — perfect day to be outside.';
      else if (cold) vibe = 'Clear but cold — layer up before you head out.';
      else           vibe = 'Clear skies, mild temps — a light jacket will do.';
    }
    else vibe = 'Cloudy skies today — comfortable conditions overall.';

    document.getElementById('ctVibe').textContent = vibe;

    // Live clock
    const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    if (_clockInterval) clearInterval(_clockInterval);
    function tick() {
      const local = new Date((Math.floor(Date.now() / 1000) + tz) * 1000);
      let h = local.getUTCHours(), m = local.getUTCMinutes(), s = local.getUTCSeconds();
      const ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      document.getElementById('ctTime').textContent =
        `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${ap}`;
      document.getElementById('ctDate').textContent =
        `${DAYS[local.getUTCDay()]}, ${MONTHS[local.getUTCMonth()]} ${local.getUTCDate()}`;
    }
    tick();
    _clockInterval = setInterval(tick, 1000);

    document.getElementById('cityTimeSection').classList.remove('hidden');
  }

  // ── City fact (Wikipedia) ─────────────────────────────────
  async function fetchCityFact(queryCity, officialName) {
    // Try official city name first, then the raw query stripped of country code
    const candidates = [officialName, queryCity.split(',')[0].trim()]
      .filter((v, i, a) => v && a.indexOf(v) === i);
    for (const name of candidates) {
      try {
        const res = await fetch(
          `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(name)}`
        );
        if (!res.ok) continue;
        const data = await res.json();
        if (data.type === 'disambiguation' || !data.extract) continue;
        // Trim to ~3 sentences so it fits the card
        const sentences = data.extract.match(/[^.!?]+[.!?]+/g) || [data.extract];
        const snippet = sentences.slice(0, 3).join(' ').trim();
        document.getElementById('cityFactText').textContent = snippet;
        document.getElementById('cityFact').classList.add('show');
        return;
      } catch { /* try next */ }
    }
  }

  // ── Leaflet Map ───────────────────────────────────────────
  function initMap(lat, lon, key) {
    document.getElementById('mapSection').classList.remove('hidden');

    if (!leafletMap) {
      leafletMap = L.map('map').setView([lat, lon], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        opacity: 0.4
      }).addTo(leafletMap);
    } else {
      leafletMap.setView([lat, lon], 7);
    }

    addWeatherTile(activeMapLayer, key);
    setTimeout(() => leafletMap.invalidateSize(), 100);
  }

  function addWeatherTile(layer, key) {
    if (weatherTileLayer) leafletMap.removeLayer(weatherTileLayer);
    const k = key || apiKeyEl.value.trim();
    weatherTileLayer = L.tileLayer(
      `https://tile.openweathermap.org/map/${layer}/{z}/{x}/{y}.png?appid=${k}`,
      { opacity: 0.65, attribution: '© OpenWeatherMap' }
    ).addTo(leafletMap);
  }

  function setMapLayer(layer, btn) {
    activeMapLayer = layer;
    document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    if (leafletMap) addWeatherTile(layer);
  }
  </script>
